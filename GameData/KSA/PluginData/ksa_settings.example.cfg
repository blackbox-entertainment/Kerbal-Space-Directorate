// KSA user settings template (structure from docs/KSA_GDD.md, section 6.5).
// Copy this file to ksa_settings.cfg in the same folder and fill in your own values.
// ksa_settings.cfg is listed in .gitignore and must NEVER be committed or shipped.
KSA_SETTINGS
{
    designMode = Hybrid        // Local | API | Hybrid | Off

    API
    {
        provider = OpenRouter
        endpoint = https://openrouter.ai/api/v1/chat/completions
        apiKey = YOUR_KEY_HERE
        designModel = <openrouter-model-id>
        postMortemModel = <openrouter-model-id>
        maxCallsPerDay = 50     // cost guard
        monthlySpendCapUSD = 5  // soft cap, tracked locally
    }

    LOCAL
    {
        endpoint = http://localhost:11434/v1/chat/completions
        model = <recommended-local-model>
        enabled = true
    }

    FALLBACK
    {
        onApiFailure = UseTemplateLibrary
        onLocalFailure = UseCannedText
    }
}
