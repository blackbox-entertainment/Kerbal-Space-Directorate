// Kerbal Space Directorate: career tracks and ranks (Jira KSA-18).
// Data-driven: players and modders can patch these with ModuleManager.
//
// RANK fields:
//   id                  stable identifier used in saves (do not rename once shipped)
//   name                display name
//   order               position on the ladder, 0 = entry
//   minStars            stock experience level required (0-5)
//   minMissions         completed missions required (Engineering also counts missions flown on a design the kerbal led, Science each full year in the lab)
//   requiresAchievement achievement pattern, repeatable; "Orbit:Kerbin", or "Land:*" for any body
//   maxSlots            agency-wide cap on holders; -1 = unlimited
//   directorSelected    true = only the Director can grant it (annual selection)
//   salary              funds per fiscal year (used from M2)
//   perk                perk identifier, repeatable (interpreted from M3)

KSA_CAREER_TRACK
{
	id = Flight
	name = Flight
	roles = Pilot

	RANK
	{
		id = TestPilot
		name = Test Pilot
		order = 0
		salary = 8000
	}
	RANK
	{
		id = AstronautCandidate
		name = Astronaut Candidate
		order = 1
		directorSelected = true
		salary = 10000
	}
	RANK
	{
		id = Astronaut
		name = Astronaut
		order = 2
		requiresAchievement = Orbit:*
		salary = 14000
	}
	RANK
	{
		id = SeniorAstronaut
		name = Senior Astronaut
		order = 3
		minStars = 3
		minMissions = 3
		salary = 18000
	}
	RANK
	{
		id = MissionCommander
		name = Mission Commander
		order = 4
		minStars = 4
		minMissions = 6
		salary = 24000
		perk = CrewMoraleBonus
		perk = SmartAbort
	}
	RANK
	{
		id = ChiefAstronaut
		name = Chief Astronaut
		order = 5
		minStars = 5
		minMissions = 10
		maxSlots = 1
		salary = 32000
		perk = AgencyMoraleBonus
		perk = PicksCrews
	}
}

