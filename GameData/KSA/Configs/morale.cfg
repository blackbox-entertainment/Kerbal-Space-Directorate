// Kerbal Space Directorate: morale rules (Jira KSA-30). Morale is 0-100; these are the deltas per event.
// Omitted events keep their built-in defaults. Events: MissionSuccess, MissionPartial, MissionFailure, CrewDeath,
// OwnMedal, OwnPromotion, PassedOver, LeanYear, CrisisYear, GoodYear, Idle, ColleagueFired, Commendation.

KSA_MORALE_RULE
{
	event = MissionSuccess
	delta = 5
}
KSA_MORALE_RULE
{
	event = MissionPartial
	delta = 1
}
KSA_MORALE_RULE
{
	event = MissionFailure
	delta = -8
}
KSA_MORALE_RULE
{
	event = CrewDeath
	delta = -15
}
KSA_MORALE_RULE
{
	event = OwnMedal
	delta = 8
}
KSA_MORALE_RULE
{
	event = OwnPromotion
	delta = 10
}
KSA_MORALE_RULE
{
	event = PassedOver
	delta = -12
}
KSA_MORALE_RULE
{
	event = LeanYear
	delta = -10
}
KSA_MORALE_RULE
{
	event = CrisisYear
	delta = -20
}
KSA_MORALE_RULE
{
	event = GoodYear
	delta = 5
}
KSA_MORALE_RULE
{
	event = Idle
	delta = -6
}
KSA_MORALE_RULE
{
	event = ColleagueFired
	delta = -4
}
KSA_MORALE_RULE
{
	event = Commendation
	delta = 12
}
