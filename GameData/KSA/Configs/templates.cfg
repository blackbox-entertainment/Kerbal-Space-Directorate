// KSA-67: colony industry modules. Built in game from a stage plan (planFile) with the parts that are loaded, so the
// craft always matches the installed part configs; the result is written to KSA/PluginData/Templates and copied to the
// save's VAB under "KSA Templates". roles = industry: used only for a base's optional industry module.
// The stock one: Duna-lander layout with a Convert-O-Tron 125 under the pod, two Drill-O-Matic Juniors and four
// OX-STAT panels on the lander. The Kerbalism one adds a greenhouse above the converter.
KSA_TEMPLATE
