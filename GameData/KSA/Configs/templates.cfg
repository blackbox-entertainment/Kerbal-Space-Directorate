// Kerbal Space Directorate: design template library (Jira KSA-34). The offline fallback when AI is off (GDD 6.6).
//   missionTypes    comma list of KSA_MISSION_TYPE ids this design can fly
//   craft           "stock:<name>" for a stock craft in Ships/VAB, or a GameData-relative .craft path (used by Live mode, M5)
//   designScore     0..1, drives simulated outcomes
//   costMultiplier  scales the mission's baseCost
//   requiredMods    comma list of mod identifiers; omitted = stock-only
// Every mission type has at least one stock-only template (hard rule). Craft files for landers arrive with M5.

