// Kerbal Space Directorate: design template library (Jira KSA-34). The offline fallback when AI is off (GDD 6.6).
//   missionTypes    comma list of KSA_MISSION_TYPE ids this design can fly
//   craft           "stock:<name>" for a stock craft in Ships/VAB, or a GameData-relative .craft path (used by Live mode, M5)
//   designScore     0..1, drives simulated outcomes
//   costMultiplier  scales the mission's baseCost
//   seats           crew seats on the craft, shown in the design picker (the stock "Kerbal 2" is a craft name, not two crew)
//   requiredMods    comma list of mod identifiers; omitted = stock-only
// Every mission type has at least one stock-only template (hard rule). Stock_*.craft files in KSA/Templates are generated
// stock-only designs for the live flight director (M5); the Eve floater and modded variants are still placeholders.

KSA_TEMPLATE
{
	id = StockFleaHop
	name = Flea test hop (starting parts)
	missionTypes = FleaHop
	craft = KSA/Templates/stock_flea_hop.craft
	seats = 1
	designScore = 0.55
	costMultiplier = 0.6
}
