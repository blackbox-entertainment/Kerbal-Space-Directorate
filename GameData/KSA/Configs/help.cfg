// Kerbal Space Directorate: the in-game Help window (Director's Office > Help, or the ? button on a window).
// One KSA_HELP_TOPIC per page, listed by order. Each "line" is one paragraph; a line starting with "# " is a heading.
// Edit freely. Avoid two slashes in a line (KSP reads the rest as a comment) and curly braces.

KSA_HELP_TOPIC
{
	id = start
	order = 1
	title = Getting started
	line = You are the Director. You hire kerbals, pick missions, set the budget and decide what flies. The kerbals design the rockets, fly them and earn their careers. You direct; they execute.
	line = # The toolbar button
	line = The KSA button on the Space Center toolbar opens the Director's Office. Every other window opens from there.
	line = # A first year
	line = 1. Open Projects and start a Flea test hop. It is the only mission open on day one and it earns the first Science.
	line = 2. Put a scientist in the lab (Roster or AI Director) so Science comes in every year.
	line = 3. Spend that Science in the stock R&D building. Missions marked (research) open as their parts are researched.
	line = 4. Look at the year's goals in the Office or the Campaign window and aim for them. The government reviews you at year end.
	line = 5. Interview and hire a few applicants in Recruiting so there are fresh pilots, engineers and scientists.
	line = Or switch on the AI Director and let it run the agency while you watch.
}

KSA_HELP_TOPIC
{
	id = year
	order = 2
	title = Year, goals, budget
	line = The agency runs on fiscal years. Each year the government sets a few goals, such as reaching space or bringing home Science, and pays a grant.
	line = # Budget review
	line = At year end the Government Review scores the goals you met. A good year raises the grant and prestige; a lean year cuts them.
	line = # Crisis Years
	line = A very bad year is a Crisis Year: budget cuts, cancelled projects and layoffs, and the Director goes on probation. A second bad year replaces the Director. The agency carries on; it is never game over.
	line = # Failed goals
	line = A goal shows [open], [met] or [failed]. A No crew losses goal fails at once when a kerbal dies, and says how many were lost. A failed mission does not fail its goal: fly it again before the year ends.
	line = # Salaries
	line = Every kerbal is paid.
}

KSA_HELP_TOPIC
{
	id = crew
	order = 3
	title = Kerbals and careers
	line = Every kerbal has a career track (Flight, Engineering, Science or Management), a rank, stars, morale and a Service Record. Click a name in the Roster to open it.
	line = # Stars and experience
	line = Stars are competence. Kerbals earn experience points from every mission they survive: more for harder missions, success and Firsts, less if the Director flew it or it failed. The Roster and the Service Record show the same stars.
	line = Ground work pays too. A lead engineer earns the same points as the crew when their design flies (other engineers on the team a quarter), and each design flown counts as a mission toward Engineering ranks. A scientist earns 3 points a year in the lab, and each full lab year counts as a mission toward Science ranks.
	line = # Ranks and medals
	line = Ranks come from stars and service. The Flight track runs Test Pilot, Astronaut Candidate, Astronaut, Senior Astronaut, Mission Commander, Chief Astronaut. Each year you choose which Test Pilots become Candidates; those passed over lose morale. Medals are awarded for firsts, distance, days on other worlds and more.
	line = # Courage, Stupidity and personality
	line = Courage is how much risk a kerbal accepts. Stupidity is the chance of a mistake. Tags such as Cautious, Reckless, Showboat, Steady and Curious change how they fly, how morale moves and how much Science they bring back.
	line = # Morale, quitting and retiring
	line = Idle kerbals, deaths and being passed over lower morale. Low morale for two year-ends in a row and a kerbal quits. Kerbals retire with age or long service. Both go to the Hall of Fame, with the dead.
	line = # Pilot rotation
	line = When the agency picks a crew it rotates pilots: fewest missions first, then the longest since their last flight. An engineer flying a mission is never also its design engineer.
}

KSA_HELP_TOPIC
{
	id = recruiting
	order = 4
	title = Recruiting
	line = Applicants come from the Kerbin Air Corps, universities, industry (poached, expensive) and walk-ins. Paid recruitment drives bring more. Higher prestige brings better applicants.
	line = # Interviews
	line = An interview costs 200 funds, and each further round with the same applicant 100 more. Each round reveals facts about the applicant. You can also hire blind and take the risk.
	line = KSA replaces the stock Astronaut Complex applicant list. Hire through Recruiting.
}

KSA_HELP_TOPIC
{
	id = projects
	order = 5
	title = Projects
	line = A project is one mission: a mission type, a design, a crew and a lead engineer. Open Projects, pick a mission, a design and a crew, then start it.
	line = # Phases
	line = Design (the engineers work for some days), then Build, then Ready, then the flight. The days left show on each project. A Watch Live project rolls out to the pad by itself a few seconds after it is Ready, and time warp stops so you can watch.
	line = # One pad
	line = Projects that are ready at the same time take turns: launches go 3 days apart (agency.cfg launchSpacingDays). A waiting project says "Launch queue" in Projects; Launch now skips the queue.
	line = # Greyed missions
	line = A mission marked (research) cannot be flown yet: no rocket can be built for it from the parts you have researched. It opens as soon as the engineering team can build one (the reason shows when you pick it, for example "no landing legs researched"), or when one of your own saved designs fits it.
	line = # Who designs the rocket
	line = The engineering team designs every rocket from the parts you have researched. With AI design on, the AI tries first; if it comes up short three times, or AI is off, the engineers design it by hand (shown as "(engineering team)"). A design that already flew the mission successfully is reused until new parts are researched; Design Review > Redesign asks for a new one.
	line = Every crewed design must carry a parachute and the science instruments researched; anything coming home from orbit or beyond also carries a heat shield (pods with their own, like the KV-1 Onion, count). With Kerbalism it also carries an antenna and a battery. One engine or booster per stack: extra boosters go on the sides, on radial decouplers. Stock parts are preferred over DLC parts.
	line = If the AI is slow (a local model), the project stays "in design" until it answers; after 2 real minutes a project with a ready-made design builds that instead.
	line = # Your own designs
	line = Build a rocket in the VAB and save it in this game: it appears under "Your designs" in Projects, with its delta-v, liftoff thrust and seats. Pick it and the crew flies your rocket instead of an AI design, as long as it fits the mission (seats, a parachute, enough delta-v and thrust, every part researched). Take Control is always allowed on your own designs. To have the AI Director fly one, pick the mission and tick "AI Director flies this" next to your design: it uses your design for that mission only, and never picks your designs on its own.
	line = # Custom missions
	line = Define your own mission: pick a body and a profile, and the agency prices it.
	line = # Cancelling
	line = Cancel refunds half the budget.
}

KSA_HELP_TOPIC
{
	id = modes
	order = 6
	title = Simulated or live flights
	line = Every project has a mode: Simulate or Watch Live.
	line = # Simulate
	line = The mission is resolved by a roll on the design, the crew and the difficulty. No craft is flown. Results, Science and experience still count.
	line = # Watch Live
	line = The rocket rolls out to the pad and the crew flies it with KSA's flight director while you watch. Kerbin missions, the Mun, Minmus and further missions fly live where KSA has the flight legs for them; others simulate.
	line = # Who picks the mode
	line = When you start a project yourself, the mode is pre-filled from the agency default (Hybrid: live only for a First the agency has not yet achieved, the rest simulated).
	line = When the AI Director starts a project, its Flights setting picks the mode: Simulate everything, Firsts live (the same rule as Hybrid), or Everything live.
	line = Either way, the project's own mode wins. The Switch to Watch Live or Switch to Simulate button on the project in the Projects window changes it at any time before the flight, whoever started it. The two settings do not conflict: one is the default, the button is the final say.
	line = Example: the Flea test hop is not a First, so under Firsts live it starts simulated. Press Switch to Watch Live on it to fly it.
	line = A project only flies, live or simulated, once its rocket has actually been built. If a design cannot be put together in the VAB, the engineers build one by hand, or redesign; when no buildable rocket can be found the project is called off and its budget returned.
}

KSA_HELP_TOPIC
{
	id = live
	order = 7
	title = Watching a live flight
	line = On the pad the Flight Director window shows the mission, the crew and each step of the flight.
	line = The KSD button on the flight toolbar (right side) shows or hides that window. Hiding it does not stop the crew. The crew holds until you press LAUNCH (or the staging key), or the AI Director gives the go after its countdown.
	line = # During the flight
	line = The pilot's stars, courage, stupidity and morale decide how precisely they fly and how often they make mistakes. The window lists each leg, the Science aboard and any judgement calls.
	line = # Taking control
	line = If the Take Control option is on (agency.cfg manualOverride), a Take Control button appears; on your own designs and hangar flights it is always there. Any stick, throttle or staging input hands the flight to you, and Hand back to crew returns it. A flight you finish is logged as Director-flown, with less experience for the crew.
	line = # How the crew flies
	line = On the pad the crew switches SAS on (and RCS, if the craft has thrusters). Off the pad they fly a pitch program east: about 78 degrees at 1 km, 53 at 10 km, 26 at 30 km, following the flight path once fast; a suborbital hop holds 85 degrees. Steering is done through stock SAS.
	line = They stage when engines burn out, but never drop a stage that still has a burning engine: burnt-out side boosters go on their own while the core keeps firing. A spent stage is dropped as soon as it is empty, so the capsule comes home alone.
	line = # Coming home
	line = The capsule turns its heat shield toward the airflow for reentry. Whatever the flight plan is doing, a craft falling back through the air arms its parachutes (forced open low down if it is still too fast). Landed crews on Kerbin are recovered after a short countdown and the game returns to the Space Center.
	line = # The mission report
	line = After recovery a KSA mission report opens under KSP's own recovery screen: each crew member's and engineer's experience, their new stars, and the Science paid. KSP's screen only shows stock experience, which a kerbal repeating a flight does not get.
	line = # Spaceplanes
	line = Planes you save in the spaceplane hangar (SPH) appear under Your designs for Kerbin suborbital and orbital missions. They roll out to the runway and the crew flies them: takeoff, a climb on the jets, rockets when the jets fade (dual-mode engines are switched, separate rockets staged), orbit, then a nose-high reentry and a glide. A plane with parachutes lands under them; without, the crew hands you the controls on final approach for the runway landing.
	line = # Hangar flights
	line = Any craft you build in the VAB with a free KSA kerbal aboard gets a pad offer: Suborbital hop, Orbit and return, or Let me fly.
}

KSA_HELP_TOPIC
{
	id = science
	order = 8
	title = Science and research
	line = Science buys parts in the stock R&D building. The tech tree is the stock one.
	line = # Where Science comes from
	line = The lab: scientists assigned to it earn Science every year, more with more stars and a Head of Science.
	line = Missions: every mission pays mission Science. Live flights also run the experiments aboard (crew report, goo, thermometer and the rest) once per situation and biome, and recovery pays them. Science missions add dedicated survey legs.
	line = Colonies: residents earn Science each year.
	line = # With Kerbalism
	line = The crew switches Kerbalism's experiments on at the start of a live flight. Kerbalism records data as the flight moves and pays it on recovery.
	line = # No storage space
	line = Kerbalism stores experiment data on small drives (the Mk1 pod holds 0.5 Mb and one sample). When they fill, experiments pause with "no storage space". Recovery empties them, and an antenna sends data home during the flight. With Kerbalism installed, every crewed AI design must carry an antenna for this.
}

KSA_HELP_TOPIC
{
	id = programs
	order = 9
	title = Bases and colonies
	line = A program is several missions building one place: a station, a base or a cloud city. Open Programs, pick a type and a body, and each module flies as its own project.
	line = # Resupply
	line = Crewed programs need resupply missions at a set interval and rotate their crews. An overdue program wears its crew down and the review hears about it. Evacuate brings a crew home.
	line = # Growing a colony
	line = Outpost, then base, then settlement (more resupplies and residents), then colony. A colony makes its own supplies with a drill, an ore converter and power, and with Kerbalism also greenhouses and recyclers. Every surface base has an optional industry module for this.
	line = Colonists can have children when there is a man, a woman and room. Eve's surface base needs the cloud city first.
	line = The Campaign window shows every world's ladder: flyby, orbit, land, Science, base, supplied, colony.
}

KSA_HELP_TOPIC
{
	id = rescue
	order = 10
	title = Rescues
	line = A rescue craft needs a seat for the pilot and one for every stranded kerbal. The Projects window shows the seats and delta-v it needs. The engineers design one with enough seats (a bigger pod, or crew cabins added), or build your own in the VAB, save it in this game, and press "Rescue with" next to it.
	line = A failed mission can leave a crew stranded in orbit or on another world. Stranded kerbals appear in Projects with a rescue mission to start. Orbital rescues can fly live; surface rescues are simulated.
	line = Stranded crews are lost after two Kerbin years, or after 20 days with Kerbalism life support. During a live flight the HUD has a Crew stranded button.
}

KSA_HELP_TOPIC
{
	id = departments
	order = 11
	title = Departments
	line = Management-track kerbals can head Finances (lower salaries, bigger grant), Science (better mission odds and lab output), Public Relations (prestige and morale) and Operations (faster design and build). Higher rank, bigger bonus. Assign them in the Departments window.
}

KSA_HELP_TOPIC
{
	id = director
	order = 12
	title = The AI Director
	line = An optional AI that runs the agency for you: it hires, interviews, staffs the lab and departments, researches, starts projects, programs, resupplies and rescues, and cancels what is not working. Everything it does goes through the same checks as you.
	line = # Turns
	line = It takes a turn every 30 days, and sooner when a mission ends, an applicant arrives, the year closes or a crew is stranded. Think now forces a turn. Its decisions and reasons are listed newest first; Show the briefing shows what it was told.
	line = # Model and cost
	line = It runs on OpenRouter with your API key from AI Setup. Claude Haiku 5.5 is the recommended model, about a cent per game year. Spending is capped in AI Setup.
	line = # Flights
	line = Its Flights setting picks the mode of the projects it starts. See Simulated or live flights. Leave the game at the Space Center between flights; live flights roll out, launch and come back by themselves.
	line = # Taking over
	line = Take over (I am the Director) switches it off. Your projects and staff stay as they are.
	line = You can still start projects yourself while it runs, including your own custom missions. The AI Director works around them and cannot cancel them.
	line = # Your designs and the campaign
	line = To have it fly one of your own rockets, pick the mission in Projects and tick "AI Director flies this" next to your design. It also sees the campaign ladder (the next step on each world) and this year's goals, and aims at the goals first.
	line = If no OpenRouter key can be read, it falls back to a local model, which is slow and often fails; the window says so in amber. Enter the key again in AI Setup.
}

KSA_HELP_TOPIC
{
	id = ai
	order = 13
	title = AI Setup (and no AI)
	line = The mod works fully with AI off: the engineering team designs the rockets by hand from the researched parts, ready-made designs fill in where they fit, and the text is written in.
	line = # Cloud AI
	line = Paste an OpenRouter API key in AI Setup for AI designs, post-mortems and the AI Director. Pick a model per task; each shows its rough cost. The key is kept in GameData/KSA/PluginData/ksa_settings.cfg on your computer and never shipped.
	line = For rocket design, Claude Haiku 5.5 is the default and Claude Sonnet 5.5 draws the best rockets. GPT-4o mini is the cheapest but its designs are weak (tanks with no engine to burn them, engines stacked on engines); the design review rejects those and the team has to try again.
	line = # Local AI
	line = Narrative (press releases, memos) and in-character crew decisions use a local model through Ollama or LM Studio, never your cloud budget. Install one of them; AI Setup can pull the recommended model.
}

KSA_HELP_TOPIC
{
	id = mods
	order = 14
	title = Other mods
	line = Required: ModuleManager.
	line = Optional and supported: Kerbalism (life support, food, water and its own experiments), Hooligan Labs Airships (cloud cities), Kerbal Planetary Base Systems, SSPX Redux. Install them through CKAN; KSA finds them by themselves.
	line = KSA never needs the Making History or Breaking Ground DLC. The README lists every mod with its CKAN name.
}

KSA_HELP_TOPIC
{
	id = records
	order = 14
	title = Records and firsts
	line = The Records window (Director's Office) has two parts.
	line = # Firsts
	line = Every step of the milestone ladder (first suborbital flight, first orbit, first spacewalk, first to the Mun, first landing on each world) with the kerbals who flew it, the mission and the date, or the rival agency that got there first. A first is credited the moment it is flown.
	line = # Agency records
	line = Highest altitude, fastest flight, farthest from Kerbin and longest mission (set by live flights), and most days in space, most missions flown and most worlds visited (career figures per kerbal), each with its holder and the date it was set. When a record is broken it makes the news, and a career record does when it changes hands.
}

KSA_HELP_TOPIC
{
	id = trouble
	order = 15
	title = Troubleshooting
	line = Every KSA line in KSP.log (in the KSP folder) starts with [KSA]. Search for it when something goes wrong.
	line = Settings: GameData/KSA/Configs/agency.cfg holds the balance and rules, each with a comment. Restart KSP after editing.
	line = A project stuck in design with AI on is waiting for the AI design; check AI Setup and your key. A mission that stays greyed needs research. A live project that will not fly live falls back to Simulate and says why in its project line.
}
