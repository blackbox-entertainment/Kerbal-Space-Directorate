// Kerbal Space Directorate: medals (Jira KSA-20).
// Data-driven: add your own KSA_MEDAL nodes or patch these with ModuleManager.
//
// Fields:
//   id             stable identifier used in saves
//   name, description
//   trigger        Achievement | DaysInSpace | Incident | Manual | FarthestDistance | DaysOnOtherWorlds | WorldsVisited | LongestMission
//   achievement    (Achievement) pattern, repeatable, all must match; "Orbit:Kerbin" or "Land:*"
//   threshold      (DaysInSpace) days; (FarthestDistance) km from Kerbin; (DaysOnOtherWorlds) days; (WorldsVisited) count; (LongestMission) days
//   incident       (Incident) Crash | Injury | Death | Rescue | Stranded
//   firstInAgency  only the first crew member to qualify gets it
//   posthumous     awarded only to the dead (e.g. Memorial Star)
//   requiresAlive  awarded only to the living

KSA_MEDAL
{
	id = OrbitalPioneer
	name = Orbital Pioneer
	description = First member of the agency to reach orbit.
	trigger = Achievement
	achievement = Orbit:*
	firstInAgency = true
}

KSA_MEDAL
{
	id = AviatorWings
	name = Aviator's Wings
	description = Flew one of the agency's aircraft.
	trigger = Achievement
	achievement = Aircraft:*
}

KSA_MEDAL
{
	id = MunWalker
	name = Mun Walker
	description = Walked on the surface of the Mun.
	trigger = Achievement
	achievement = Land:Mun
	achievement = EVA:Mun
}

KSA_MEDAL
{
	id = Lifesaver
	name = Lifesaver
	description = Took part in a successful rescue.
	trigger = Incident
	incident = Rescue
	requiresAlive = true
}

KSA_MEDAL
{
	id = IronKerbal
	name = Iron Kerbal
	description = One hundred cumulative days in space.
	trigger = DaysInSpace
	threshold = 100
}

KSA_MEDAL
{
	id = Survivor
	name = Survivor
	description = Walked away from a mission failure.
	trigger = Incident
	incident = Crash
	requiresAlive = true
}

KSA_MEDAL
{
	id = MemorialStar
	name = Memorial Star
	description = Killed in the line of duty.
	trigger = Incident
	incident = Death
	posthumous = true
}

// Director-awarded. The Director may give out perYearLimit of these per fiscal year (Jira KSA-31).
KSA_MEDAL
{
	id = ChiefsCommendation
	name = Chief's Commendation
	description = Awarded by the Director for conduct the agency wants more of.
	trigger = Manual
	perYearLimit = 2
}

