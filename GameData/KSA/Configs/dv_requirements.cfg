// Kerbal Space Directorate: what each mission asks of a rocket.
//
// Since 0.5.9 every mission past a suborbital hop is worked out LEG BY LEG from the delta-v map below (KSA.Core
// FlightBudget): lift-off through the thick air (sea-level Isp, thrust-to-weight 1.3 to 2.6), the climb to Kerbin orbit,
// transfer, capture, descent (thrust-to-weight 1.5 in that world's gravity, 1.3 under parachutes), take-off, the trip
// home. The design review flies every design through those legs, stage by stage; the engineers size each stage for its
// legs with a 10% margin. Base modules and resupplies fly one way; a base's "return" module carries the fuel home.
//
// KSA_DV_BODY: one world on the map (vacuum m/s, from the stock community delta-v map, rounded up a little).
//   gravity     surface gravity, m/s^2 (thrust-to-weight on landing and take-off is measured against it)
//   atmosphere  true when parachutes and the air do most of the descent (and the take-off burns in thick air)
//   intercept   low Kerbin orbit to an encounter (escape, transfer, half the plane change)
//   capture     encounter to low orbit
//   surface     low orbit to the surface, and back up
//   return      low orbit to a Kerbin reentry (aerobraking at Kerbin)
//   kerbinMoon  a flyby comes home on a free return
//
// KSA_DV_REQUIREMENT: a mission with one climb and no map (suborbital hops), or a fixed figure for one mission type
// (missionType = ...), which replaces the legs for that mission.

KSA_DV_REQUIREMENT
{
	profile = Suborbital
	body = Kerbin
	deltaV = 1800
	minTwr = 1.2
}
KSA_DV_REQUIREMENT
{
	missionType = FleaHop         // one mission only: a Flea on a pod is a test hop, not a trip above the atmosphere
	profile = Suborbital
	body = Kerbin
	deltaV = 500
	minTwr = 1.5
}
KSA_DV_REQUIREMENT
{
	missionType = SoundingRocketKerbin   // a probe on a small booster: up a few kilometres for the first readings (2026-10-30)
	profile = Suborbital
	body = Kerbin
	deltaV = 500
	minTwr = 1.5
}
KSA_DV_REQUIREMENT
{
	missionType = EveSurfaceBaseModule   // one-way: transfer, propulsive capture (the flight director does not aerobrake), parachutes and a short burn
	profile = Base
	body = Eve
	deltaV = 6300
	minTwr = 1.2
}
KSA_DV_REQUIREMENT
{
	missionType = BaseResupplyEveSurface
	profile = Base
	body = Eve
	deltaV = 6300
	minTwr = 1.2
}

