// Kerbal Space Directorate: agency-wide tunables (Jira KSA-26, KSA-28, KSA-30).
// Patch with ModuleManager to rebalance. Every value has a built-in default if omitted.
KSA_AGENCY_SETTINGS
{
	startingBalance = 50000       // founding balance when there is no stock Funds account (Sandbox/Science)
	baseGrant = 150000            // government grant per fiscal year before review and prestige modifiers
	goalsPerYear = 3              // program goals issued each year (2-4 recommended)
	startingPrestige = 50         // 0-100; scales the grant (0.75x .. 1.25x) and applicant quality
	quitMorale = 20               // morale below this at year end counts toward quitting
	quitYears = 2                 // consecutive low-morale year-ends before a crew member resigns
	retireAge = 55                // retires at the year end on or after this age
	retireServiceYears = 25       // or after this many years of service
	walkInsPerQuarter = 1         // unsolicited applicants per quarter (needs a source with walkInWeight > 0)
	maxApplicants = 12            // applicant pool cap
	interviewBaseCost = 200       // funds for an applicant's first interview; or hire blind and take the risk
	interviewCostStep = 100       // each further interview of the same applicant costs this much more (200, 300, 400, 500)
	interviewFeeFraction = 0.1    // first interview is at least this share of the hire fee (a 15,000 poach costs 1,500 to vet)
	crisisLayoffFraction = 0.25   // share of active crew the government demands laid off in a Crisis Year
	personalityTags = Cautious, Reckless, Perfectionist, Showboat, Steady, Curious

	// Projects and missions (M3)
	defaultMissionMode = Hybrid   // Simulate | WatchLive | Hybrid (live only for an unachieved First)
	designBaseDays = 10           // design phase length before difficulty and lead-engineer modifiers
	buildBaseDays = 15            // build phase length before cost modifier (+1 day per 10,000 funds)
	cancelRefundFraction = 0.5    // share of a project's budget refunded on cancellation
	autoRecover = true            // recover landed crewed vessels on Kerbin automatically after a 10 s countdown
	agencyName = Kerbal Space Directorate   // used in press releases and memos
	manualOverride = false        // opt-in: a Take Control button during live flights (logged as Director-flown)
	liveOrbitAltitude = 85000     // metres; target orbit for live Kerbin flights flown by the built-in flight director
	liveTargetOrbitAltitude = 50000   // metres above the Mun, Minmus, Duna...: capture orbit and the orbit reached after a surface ascent
	liveReentryPeriapsis = 35000      // metres; Kerbin periapsis the flight director aims for when coming home
	liveFlightScope = All             // Kerbin = only suborbital/orbit; Moons = plus Mun/Minmus; All = plus interplanetary and stations
	crewDecisions = Local            // judgement calls in flight: Rule = traits only; Local = ask the local model as the kerbal (rule fallback); Any = local or API; Off
	stockContracts = false            // false: stock Mission Control contracts are withdrawn as they appear (KSA goals replace them); true: leave them
	stockHiring = false               // false: a hire from the stock Astronaut Complex list is refunded and charged at the KSA walk-in rate instead; true: stock prices
	autoRolloutSeconds = 5            // a Watch Live project rolls out to the pad by itself this long after it is Ready (time warp stops when it is Ready) (0 = wait for the Director in Mission Control)
	launchOnCommand = true            // on the pad the crew holds until the Director presses Launch on the HUD (or the staging key); false = they go at once
	launchSpacingDays = 3            // one pad: projects ready together take turns, this many days apart (simulated launches and live roll-outs; Launch now skips the queue). 0 = no spacing
	rivals = true                 // three rival agencies (rivals.cfg) race up the milestone ladder; set false for a quiet sky

	// Courage and Stupidity drift with experience (GDD decision 17). Small steps; stupidity never drops below the floor.
	TRAIT_DRIFT
	{
		enabled = true
		stupidityFloor = 0.15
		courageMin = 0.10
		courageMax = 0.95
		successStupidity = -0.03
		successCourage = 0.03
		partialStupidity = -0.02
		partialCourage = 0.01
		survivedFailureStupidity = -0.05
		survivedFailureCourage = 0.02
		crewmateDeathCourage = -0.05
		colleagueDeathCourage = -0.02
		idleYearCourage = -0.02
	}

	// The kerbals fly (decision 21). Stars buy precision, courage thins the safety margins, stupidity buys mistakes.
	// Department heads (M2): Management-track kerbals hold Finances, Science, Public Relations and Operations.
	// Effects scale with rank rung (Program Manager 1, Deputy Director 2) plus starWeight per star above three.
	// Research (M3): the stock tech tree stays; the agency earns the Science to climb it. Lab scientists produce
	// labBase + labPerStar x stars Science per fiscal year (non-scientists half); successful missions return Science by tier.
	RESEARCH
	{
		experimentsOnEveryFlight = true  // live flights run the experiments aboard (crew report, goo...) on every mission; with Kerbalism they switch its experiments on
		labBase = 2
		labPerStar = 4
		headOfScienceBonus = 0.15     // x (1 + bonus x Head of Science rung)
		missionEarly = 12
		missionMid = 40
		missionLate = 120
	}

	// Experience (KSA-63): every mission pays points to the surviving crew; stars are the higher of the game's own
	// level (firsts per body) and this ladder. Points = tier value x (1 + successBonus) [x survivedFailureFactor if it
	// failed] + perExtraDay x (mission days - 1) + firstBonus when it claimed a First, x directorFactor if the Director flew.
	EXPERIENCE
	{
		enabled = true
		early = 2
		mid = 4
		late = 8
		successBonus = 0.5
		firstBonus = 4
		perExtraDay = 0.2
		directorFactor = 0.5
		survivedFailureFactor = 0.25
		designLead = 1.0             // ground work: lead engineer gets this share of the design points (tier x success, + First) when the design flies
		designTeam = 0.25            // each other engineer on the design team
		failedDesign = 0.25          // design points multiplier when the mission failed (instead of 1 + successBonus)
		labPerYear = 3               // points for a full year in the research lab, paid day by day
		stars = 4, 12, 28, 60, 110
	}

	// Colonies (KSA-64): outpost (first module) > base (all modules) > settlement > colony. A settlement needs the
	// stationed rocket (return module), settlementResupplies and settlementResidents; its supplies last x settlementSupplyFactor.
	// A colony also needs a drill, an ore converter and power among the delivered craft (the base's optional industry
	// module, added with "Add module", carries them); while self-sufficient it needs no supplies at all.
	// Self-sufficient places with a man and a woman living there grow by birthChancePerPair per pair per year while there is room.
	COLONY
	{
		enabled = true
		settlementResupplies = 3
		settlementResidents = 4
		colonyResupplies = 6
		colonyResidents = 8
		settlersPerResupply = 2
		roomPerResupply = 2
		settlementSupplyFactor = 2
		birthChancePerPair = 0.25
		colonyRoomPerYear = 2
		colonyRoomPerResidents = 10
		sciencePerResident = 1.5      // per year; settlements earn half
		fundsPerResident = 1000
		prestigePerColony = 1
		comeOfAgeChance = 0.25
		comeOfAgeMinColonists = 6
		bornSource = ColonyBorn
	}

	// Rescues (KSA-65): a simulated abort or lost vehicle with survivors strands them with these chances; a live flight
	// is declared stranded from the Flight Director window. Stranded crews lose morale each year and are declared lost
	// after lostAfterDays (0 = never). Rescues are launched from the Projects window.
	RESCUE
	{
		enabled = true
		strandChanceKerbinOrbit = 0.15
		strandChanceAway = 0.35
		moralePerYear = 10
		prestigePerYear = 3
		lostAfterDays = 852           // two Kerbin years
		rescuedMorale = 10
	}

	// Life support (KSA-67): used only when Kerbalism is installed (through CKAN). A self-sufficient settlement or
	// colony must then also grow its food (a greenhouse per residentsPerGreenhouse residents) and, with requireRecyclers,
	// have scrubber and water recycler capacity for every resident (Kerbalism gives each crew pod its seat count).
	// A self-sufficient colony fits out the room it builds and adds a greenhouse every colonyGreenhouseEveryYears.
	// Live flights must carry food and water for durationDays + marginDays, or they are simulated. Stranded crews
	// are lost after strandedLostAfterDays. While a program is supplied, topUpSuppliedVessels keeps the food, water
	// and air of its live vessels full: the resupply flights stand in for the cargo. Overdue programs are on their own.
	// Rates are per 6-hour Kerbin day, from Kerbalism's default profile. enabled = false ignores Kerbalism entirely.
	LIFE_SUPPORT
	{
		enabled = true
		residentsPerGreenhouse = 8
		requireRecyclers = true
		colonyGreenhouseEveryYears = 2
		foodPerKerbalDay = 0.2624
		waterPerKerbalDay = 0.1344
		marginDays = 2
		strandedLostAfterDays = 20
		topUpSuppliedVessels = true
	}

	// AI Director (KSA-68): optional, switched on per game in the AI Director window. It takes a turn every
	// turnIntervalDays of game time, sooner (never closer than minGapDays) when a mission ends, an applicant arrives,
	// the year closes or a crew is stranded. goSeconds: launch hold countdown before the AI gives the go.
	// returnSeconds: after a live flight ends without a recovery, the game returns to the Space Center.
	AI_DIRECTOR
	{
		turnIntervalDays = 30
		minGapDays = 5
		maxActionsPerTurn = 6
		timeoutSeconds = 120
		goSeconds = 10
		returnSeconds = 15
		costPerTurnUSD = 0.002
		logKept = 120
	}

	DEPARTMENTS
	{
		enabled = true
		salaryCutPerRung = 0.03       // Finances
		grantBonusPerRung = 0.02      // Finances
		successBonusPerRung = 0.02    // Science: simulated mission success chance, absolute
		prestigeBonusPerRung = 0.05   // Public Relations: prestige gains
		moralePerRung = 2             // Public Relations: morale to everyone at year end
		buildCutPerRung = 0.05        // Operations: design and build days
		starWeight = 0.25
	}

	// What the personality tags do (built 2026-10-27). Effects stack when a kerbal has two tags. Omit the block for these defaults.
	//   nerve: added to a pilot's courage in flight (thinner margins)   mistakeFactor: x on the per-leg mistake chance
	//   precision: added to flight precision                            moraleLossFactor / moraleGainFactor: x on morale changes
	//   ignoresIdle: no idle-year morale dip                           scienceFactor: x on lab output and science-mission yield
	//   prestigeOnSuccess / prestigeOnFirst: prestige when this kerbal's mission succeeds / is a First
	//   moraleIfSimulated: morale change when their mission is simulated instead of watched
	//   designPasses / designScore / buildTimeFactor: as lead engineer   moraleOnFailure: extra morale change on an abort or loss
	PERSONALITY
	{
		TAG
		{
			tag = Cautious
			nerve = -0.15
			mistakeFactor = 0.7
			precision = 0.05
			moraleOnFailure = -3
		}
		TAG
		{
			tag = Reckless
			nerve = 0.2
			mistakeFactor = 1.4
			prestigeOnSuccess = 1
			moraleOnFailure = -8
		}
		TAG
		{
			tag = Showboat
			prestigeOnFirst = 2
			prestigeOnSuccess = 0.5
			moraleIfSimulated = -6
			moraleGainFactor = 1.3
		}
		TAG
		{
			tag = Steady
			moraleLossFactor = 0.5
			moraleGainFactor = 0.7
			ignoresIdle = true
			mistakeFactor = 0.85
		}
		TAG
		{
			tag = Curious
			scienceFactor = 1.25
			precision = -0.02
		}
		TAG
		{
			tag = Perfectionist
			designPasses = 2
			designScore = 0.05
			buildTimeFactor = 1.15
			mistakeFactor = 0.8
		}
	}


	FLIGHT_CREW
	{
		enabled = true
		mistakeBase = 0.04          // chance per flight leg of a pilot mistake for a 0-star, 0-stupidity pilot
		mistakeStupidity = 0.30     // added at stupidity 1.0
		mistakePerStar = 0.03       // removed per star
		mistakeLowMorale = 0.06     // added when the pilot's morale is under 40
		mistakeMax = 0.45
		lateIgnitionMax = 8         // a late-ignition mistake slips the burn by 2..this many seconds
		burnToleranceBest = 0.2     // m/s of delta-v left when a perfect pilot calls a burn done
		burnToleranceWorst = 2.5
		marginCautious = 1.5        // landing safety margin multiplier at courage 0
		marginBrave = 0.95          // ... and at courage 1
		approachWorst = 0.6         // docking approach speed multiplier for a hopeless pilot
		approachBest = 1.15         // ... and a perfect one
	}
}
