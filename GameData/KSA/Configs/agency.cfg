// Kerbal Space Directorate: agency-wide tunables (Jira KSA-26, KSA-28, KSA-30).
// Patch with ModuleManager to rebalance. Every value has a built-in default if omitted.
KSA_AGENCY_SETTINGS
{
	startingBalance = 50000       // founding balance when there is no stock Funds account (Sandbox/Science)
	baseGrant = 150000            // government grant per fiscal year before review and prestige modifiers
	goalsPerYear = 3              // program goals issued each year (2-4 recommended)
	startingPrestige = 50         // 0-100; scales the grant (0.75x .. 1.25x) and applicant quality
	quitMorale = 20               // morale below this at year end counts toward quitting
	quitYears = 2                 // consecutive low-morale year-ends before a crew member resigns
	retireAge = 55                // retires at the year end on or after this age
	retireServiceYears = 25       // or after this many years of service
	walkInsPerQuarter = 1         // unsolicited applicants per quarter (needs a source with walkInWeight > 0)
	maxApplicants = 12            // applicant pool cap
	interviewBaseCost = 200       // funds for an applicant's first interview; or hire blind and take the risk
	interviewCostStep = 100       // each further interview of the same applicant costs this much more (200, 300, 400, 500)
	interviewFeeFraction = 0.1    // first interview is at least this share of the hire fee (a 15,000 poach costs 1,500 to vet)
	crisisLayoffFraction = 0.25   // share of active crew the government demands laid off in a Crisis Year
	personalityTags = Cautious, Reckless, Perfectionist, Showboat, Steady, Curious

	// Projects and missions (M3)
	defaultMissionMode = Hybrid   // Simulate | WatchLive | Hybrid (live only for an unachieved First)
	designBaseDays = 10           // design phase length before difficulty and lead-engineer modifiers
	buildBaseDays = 15            // build phase length before cost modifier (+1 day per 10,000 funds)
	cancelRefundFraction = 0.5    // share of a project's budget refunded on cancellation
	autoRecover = true            // recover landed crewed vessels on Kerbin automatically after a 10 s countdown
	agencyName = Kerbal Space Directorate   // used in press releases and memos
	manualOverride = false        // opt-in: a Take Control button during live flights (logged as Director-flown)
	liveOrbitAltitude = 85000     // metres; target orbit for live Kerbin flights flown by the built-in flight director
	liveTargetOrbitAltitude = 50000   // metres above the Mun, Minmus, Duna...: capture orbit and the orbit reached after a surface ascent
	liveReentryPeriapsis = 35000      // metres; Kerbin periapsis the flight director aims for when coming home
	liveFlightScope = All             // Kerbin = only suborbital/orbit; Moons = plus Mun/Minmus; All = plus interplanetary and stations
	crewDecisions = Local            // judgement calls in flight: Rule = traits only; Local = ask the local model as the kerbal (rule fallback); Any = local or API; Off
	stockContracts = false            // false: stock Mission Control contracts are withdrawn as they appear (KSA goals replace them); true: leave them
	stockHiring = false               // false: a hire from the stock Astronaut Complex list is refunded and charged at the KSA walk-in rate instead; true: stock prices
	autoRolloutSeconds = 20           // a Watch Live project rolls out to the pad by itself this long after it is Ready (0 = wait for the Director in Mission Control)
	launchOnCommand = true            // on the pad the crew holds until the Director presses Launch on the HUD (or the staging key); false = they go at once
	rivals = true                 // three rival agencies (rivals.cfg) race up the milestone ladder; set false for a quiet sky

	// Courage and Stupidity drift with experience (GDD decision 17). Small steps; stupidity never drops below the floor.
	TRAIT_DRIFT
	{
		enabled = true
		stupidityFloor = 0.15
		courageMin = 0.10
		courageMax = 0.95
		successStupidity = -0.03
		successCourage = 0.03
		partialStupidity = -0.02
		partialCourage = 0.01
		survivedFailureStupidity = -0.05
		survivedFailureCourage = 0.02
		crewmateDeathCourage = -0.05
		colleagueDeathCourage = -0.02
		idleYearCourage = -0.02
	}

	// The kerbals fly (decision 21). Stars buy precision, courage thins the safety margins, stupidity buys mistakes.
	// Department heads (M2): Management-track kerbals hold Finances, Science, Public Relations and Operations.
	// Effects scale with rank rung (Program Manager 1, Deputy Director 2) plus starWeight per star above three.
	// Research (M3): the stock tech tree stays; the agency earns the Science to climb it. Lab scientists produce
	// labBase + labPerStar x stars Science per fiscal year (non-scientists half); successful missions return Science by tier.
	RESEARCH
	{
		labBase = 2
		labPerStar = 4
		headOfScienceBonus = 0.15     // x (1 + bonus x Head of Science rung)
		missionEarly = 12
		missionMid = 40
		missionLate = 120
	}

	DEPARTMENTS
	{
		enabled = true
		salaryCutPerRung = 0.03       // Finances
		grantBonusPerRung = 0.02      // Finances
		successBonusPerRung = 0.02    // Science: simulated mission success chance, absolute
		prestigeBonusPerRung = 0.05   // Public Relations: prestige gains
		moralePerRung = 2             // Public Relations: morale to everyone at year end
		buildCutPerRung = 0.05        // Operations: design and build days
		starWeight = 0.25
	}

	FLIGHT_CREW
	{
		enabled = true
		mistakeBase = 0.04          // chance per flight leg of a pilot mistake for a 0-star, 0-stupidity pilot
		mistakeStupidity = 0.30     // added at stupidity 1.0
		mistakePerStar = 0.03       // removed per star
		mistakeLowMorale = 0.06     // added when the pilot's morale is under 40
		mistakeMax = 0.45
		lateIgnitionMax = 8         // a late-ignition mistake slips the burn by 2..this many seconds
		burnToleranceBest = 0.2     // m/s of delta-v left when a perfect pilot calls a burn done
		burnToleranceWorst = 2.5
		marginCautious = 1.5        // landing safety margin multiplier at courage 0
		marginBrave = 0.95          // ... and at courage 1
		approachWorst = 0.6         // docking approach speed multiplier for a hopeless pilot
		approachBest = 1.15         // ... and a perfect one
	}
}
