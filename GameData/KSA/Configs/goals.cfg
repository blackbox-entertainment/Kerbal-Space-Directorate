// Kerbal Space Directorate: government Program Goals (Jira KSA-27).
// Each fiscal year the government issues goalsPerYear of these. Add your own KSA_GOAL nodes.
//
// Fields:
//   id, name, description
//   tier        Early | Mid | Late | Program | Conditional (lowest open tier is issued first; at most one Conditional per year)
//   condition   Achievement | MissionsThisYear | NoCrewLoss | UnderBudget
//   pattern     (Achievement) "Type:Body" with * wildcard, e.g. Orbit:Kerbin, Land:*, Flyby:Duna
//   threshold   (MissionsThisYear) count required
//   weight      selection weight within the tier (default 1)
//   repeatable  may be issued again after being met (default: true for non-Achievement goals)
//   multiYear   carries over instead of being marked missed (default false)

// ---------------------------------------------------------------- Early
KSA_GOAL
{
	id = ReachSpace
	name = Reach space
	description = Send a crewed vehicle above the atmosphere and bring it back.
	tier = Early
	condition = Achievement
	pattern = Suborbit:Kerbin
	weight = 3
}
KSA_GOAL
{
	id = AchieveOrbit
	name = Achieve orbit
	description = Put a crew member into a stable orbit of the home world.
	tier = Early
	condition = Achievement
	pattern = Orbit:Kerbin
	weight = 3
}
KSA_GOAL
{
	id = FirstEVA
	name = First spacewalk
	description = A crew member leaves the vehicle in flight.
	tier = Early
	condition = Achievement
	pattern = EVA:Kerbin
	weight = 2
}
KSA_GOAL
{
	id = ReturnSafely
	name = Return a crew safely
	description = Recover a crewed vehicle after a flight.
	tier = Early
	condition = Achievement
	pattern = Recover:*
	weight = 2
}

