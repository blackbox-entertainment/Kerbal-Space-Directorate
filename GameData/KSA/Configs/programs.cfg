// Kerbal Space Directorate: program types (stations, bases, cloud cities) and their module recipes (Jira KSA-37).
//   Every base and cloud city ends with a "return" module: a rocket that stays, so crews can rotate and evacuate (KSA-64).
//   requiresProgram  a program of that type must be finished at the same body first
//   returnVia        relieved crews go to that program at the same body instead of straight home
//   colonize         can grow into a settlement and a colony (default: yes for bases and cloud cities)
//   kind    OrbitalStation | SurfaceBase | CloudCity
//   bodies  where it can be built
//   MODULE  role + missionType, in build order
//           templates = design ids to use first; optional = true: not needed to finish the program, built later with Add module
//           (KSA-67: every surface base has an optional industry module carrying a drill, an ore converter and power,
//           plus a greenhouse with Kerbalism; a base becomes a colony only once it is delivered)

KSA_PROGRAM_TYPE
{
	id = KerbinStation
	name = Orbital station
	description = A four-module station in Kerbin orbit: core, habitation, power, lab.
	kind = OrbitalStation
	supplyIntervalDays = 180
	resupplyMissionType = StationResupplyKerbin
	bodies = Kerbin
	MODULE
	{
		role = core
		missionType = StationCoreKerbin
	}
	MODULE
	{
		role = habitation
		missionType = StationModuleKerbin
	}
	MODULE
	{
		role = power
		missionType = StationModuleKerbin
	}
	MODULE
	{
		role = lab
		missionType = StationModuleKerbin
	}
}
