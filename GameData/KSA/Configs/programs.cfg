// Kerbal Space Directorate: program types (stations, bases, cloud cities) and their module recipes (Jira KSA-37).
//   kind    OrbitalStation | SurfaceBase | CloudCity
//   bodies  where it can be built
//   MODULE  role + missionType, in build order

KSA_PROGRAM_TYPE
{
	id = KerbinStation
	name = Orbital station
	description = A four-module station in Kerbin orbit: core, habitation, power, lab.
	kind = OrbitalStation
	bodies = Kerbin
	MODULE
	{
		role = core
		missionType = StationCoreKerbin
	}
	MODULE
	{
		role = habitation
		missionType = StationModuleKerbin
	}
	MODULE
	{
		role = power
		missionType = StationModuleKerbin
	}
	MODULE
	{
		role = lab
		missionType = StationModuleKerbin
	}
}
