// Kerbal Space Directorate: Un Kerballed Start (2026-10-30, T: "why not just start it with Stayputnik ... it needs a
// parachute though ... and better rocket ... and a basic coupler"; "the Stayputnik needs a radial parachute").
// Un Kerballed Start opens a career with only the Stayputnik probe core and the tiny Mite booster. KSA's first missions are
// uncrewed sounding rockets, and they want a little more:
//   Mk2-R radial parachute  the Stayputnik is a sphere with no nose for a stack chute; a pair of these brings it home
//   Mk16 parachute          for the first crew pod later on
//   RT-5 Flea               a better booster than the Mite
//   TD-06 decoupler         a second stage
// These four move to the start node, free. Only with Un Kerballed Start installed; runs after its own tech moves (they run
// BEFORE[zzzUnKerballedStart]).
@PART[parachuteSingle|parachuteRadial|solidBooster_sm_v2|Decoupler_0]:NEEDS[UnKerballedStart]:FINAL
{
	@TechRequired = start
	@entryCost = 0
}
