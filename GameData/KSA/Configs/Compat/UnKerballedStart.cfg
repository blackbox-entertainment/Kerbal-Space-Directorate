// Kerbal Space Directorate: Un Kerballed Start (2026-10-30, T: "why not just start it with Stayputnik ... it needs a
// parachute though ... and better rocket ... and a basic coupler").
// Un Kerballed Start opens a career with only the Stayputnik probe core and the tiny Mite booster. KSA's first missions are
// uncrewed sounding rockets, and they want a little more: the Mk16 parachute (to bring the probe and its samples home), the
// RT-5 Flea booster and the TD-06 decoupler (a second stage). These three move to the start node, free. Only with Un Kerballed
// Start installed; runs after its own tech moves (they run BEFORE[zzzUnKerballedStart]).
@PART[parachuteSingle|solidBooster_sm_v2|Decoupler_0]:NEEDS[UnKerballedStart]:FINAL
{
	@TechRequired = start
	@entryCost = 0
}
