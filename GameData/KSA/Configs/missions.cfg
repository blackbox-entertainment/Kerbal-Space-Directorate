// Kerbal Space Directorate: mission types (Jira KSA-34).
//   tier          Early | Mid | Late
//   profile       Suborbital | Orbit | Flyby | OrbitBody | Land | Station | Base
//   crew          crew size
//   minStars      stars every crew member needs
//   durationDays  in-flight days (simulated)
//   baseCost      funds, before the template's cost multiplier
//   difficulty    0 (easy) .. 1 (brutal)
//   achievements  comma list, easiest first; the last one is the mission's purpose
//   first         true = a "First" that the Hybrid default flies live when unachieved
//   moduleRole    only for program modules

